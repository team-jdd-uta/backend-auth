spring.application.name=backend-auth
server.port=${SERVER_PORT:8088}

cognito.issuer-uri=${COGNITO_ISSUER_URI:}
cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
cognito.region=${COGNITO_REGION:${AWS_REGION:ap-northeast-2}}
cognito.client-id=${COGNITO_CLIENT_ID:}

login-service.base-url=${LOGIN_SERVICE_BASE_URL:http://backend-login-service:8081}
login-service.internal-token=${LOGIN_SERVICE_INTERNAL_TOKEN:}

auth.public-routes=GET /health,GET /api/room/rooms,GET /api/room/rooms/categories,GET /api/room/rooms/counts,GET /api/user/comments/room,GET /api/chat-history,GET /api/chat-history/summaries,GET /api/chat-history/comments,POST /auth/login,POST /auth/register,POST /auth/refresh
